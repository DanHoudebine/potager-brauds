<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fond dégradé vert, repris de l'icône -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#3f815b"/>
      <stop offset="0.55" stop-color="#2f6647"/>
      <stop offset="1" stop-color="#1f4a34"/>
    </linearGradient>
    <!-- Dégradé des feuilles, vert clair / crème -->
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7ee"/>
      <stop offset="1" stop-color="#cde0bf"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0d2c1d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="1024" height="500" fill="url(#bg)"/>
  <!-- Halo lumineux derrière le logo -->
  <circle cx="270" cy="250" r="320" fill="url(#glow)"/>

  <!-- Motifs feuilles décoratifs très discrets -->
  <g fill="#ffffff" opacity="0.05">
    <path d="M880 70 q60 -10 90 40 q-60 10 -90 -40 z"/>
    <path d="M930 400 q55 15 45 75 q-55 -15 -45 -75 z"/>
    <circle cx="820" cy="430" r="8"/>
    <circle cx="960" cy="140" r="6"/>
    <circle cx="120" cy="90" r="6"/>
  </g>

  <!-- ===== Badge rond avec le germe ===== -->
  <g filter="url(#soft)">
    <circle cx="270" cy="250" r="150" fill="#2a5c40"/>
    <circle cx="270" cy="250" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
  </g>

  <!-- Le germe (repris de l'icône 512) — centré sur le badge -->
  <g transform="translate(135, 100) scale(0.527)">
    <!-- Terre -->
    <ellipse cx="256" cy="372" rx="92" ry="22" fill="#4a3320"/>
    <!-- Tige -->
    <path d="M250 372 L250 250 Q250 240 256 240 Q262 240 262 250 L262 372 Z" fill="url(#leaf)"/>
    <!-- Feuille droite -->
    <path d="M262 270 Q330 175 392 192 Q378 268 290 285 Q268 286 262 270 Z" fill="url(#leaf)"/>
    <path d="M285 270 L370 205" stroke="#b9d3a6" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8"/>
    <!-- Feuille gauche -->
    <path d="M250 280 Q175 200 148 215 Q160 280 232 292 Q246 290 250 280 Z" fill="url(#leaf)"/>
    <path d="M232 285 L168 228" stroke="#b9d3a6" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.8"/>
    <!-- Bourgeon central -->
    <circle cx="256" cy="268" r="14" fill="#f4f7ee"/>
  </g>

  <!-- ===== Texte ===== -->
  <text x="500" y="218" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-1">Potager</text>
  <text x="500" y="298" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-1">de Poche</text>
  <text x="503" y="356" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="29" font-weight="500" fill="#d9ecca">Votre jardin connecté, dans votre poche</text>

  <!-- Petites pastilles fonctionnalités -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1f4a34">
    <rect x="503" y="392" width="120" height="44" rx="22" fill="#e7f3da"/>
    <text x="525" y="420">Météo</text>
    <rect x="635" y="392" width="158" height="44" rx="22" fill="#e7f3da"/>
    <text x="657" y="420">62 plantes</text>
    <rect x="805" y="392" width="158" height="44" rx="22" fill="#e7f3da"/>
    <text x="827" y="420">Calendrier</text>
  </g>
</svg>
