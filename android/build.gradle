// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.0'
        // google-services (Firebase natif) volontairement retiré : cette app
        // utilise Firebase via le SDK web (CDN), pas le SDK natif. Sa présence
        // tirait BouncyCastle 1.79 (classes Java 21) que l'instrumentation
        // Gradle ne savait pas lire → échec de build.

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
